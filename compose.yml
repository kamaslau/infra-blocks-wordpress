name: trial-wordpress

volumes:
  wordpress_data:

networks:
  backend:

services:
  wordpress:
    container_name: wordpress
    image: wordpress:7.0-php8.5
    restart: unless-stopped
    networks:
      - backend
    ports:
      - ${PORT-80}:80
    volumes:
      - type: volume
        source: wordpress_data
        target: /var/www/html
      # - type: bind
      #   source: ./wordpress
      #   target: /var/www/html
